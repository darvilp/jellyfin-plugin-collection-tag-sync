services:
  browser-e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    init: true
    user: "${JFTS_UID:-1000}:${JFTS_GID:-1000}"
    depends_on:
      jellyfin:
        condition: service_healthy
    environment:
      CI: "${CI:-}"
      PLAYWRIGHT_BASE_URL: http://jellyfin:8096
      JFTS_ADMIN_NAME: jfts-admin
      JFTS_ADMIN_PASSWORD: jfts-local-only
    volumes:
      - ./artifacts/playwright:/work/artifacts
    networks:
      testnet:

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.CollectionTagSync.sln

      - name: Test administrator UI
        run: |
          node --check --experimental-default-type=module Jellyfin.Plugin.CollectionTagSync/Configuration/configPage.js
          node --test --experimental-default-type=module tests/ui/configPage.test.js

      - name: Lint workflows with pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum --check
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}"
          "${install_dir}/actionlint"

      - name: Test release tooling
        run: |
          bash -n scripts/read-build-metadata.sh scripts/package.sh scripts/install-local-plugin.sh scripts/verify-package.sh scripts/verify-release-contract.sh scripts/verify-manifest-history.sh scripts/prepare-release-assets.sh scripts/configure-test-server.sh scripts/test-browser-e2e.sh scripts/test-collection-selection.sh scripts/test-manifest-install.sh scripts/test-manifest-upgrade.sh scripts/test-run-once.sh tests/release/release-tooling.test.sh
          shellcheck scripts/read-build-metadata.sh scripts/package.sh scripts/install-local-plugin.sh scripts/verify-package.sh scripts/verify-release-contract.sh scripts/verify-manifest-history.sh scripts/prepare-release-assets.sh scripts/configure-test-server.sh scripts/test-browser-e2e.sh scripts/test-collection-selection.sh scripts/test-manifest-install.sh scripts/test-manifest-upgrade.sh scripts/test-run-once.sh tests/release/release-tooling.test.sh
          tests/release/release-tooling.test.sh

      - name: Build
        run: dotnet build Jellyfin.Plugin.CollectionTagSync.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.CollectionTagSync.sln --configuration Release --no-build --no-restore --verbosity normal

  package:
    name: Build JPRM package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Build plugin package
        id: package
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: net9.0

      - name: Verify package contents
        run: ./scripts/verify-package.sh "${{ steps.package.outputs.artifact }}"

      - name: Test administrator workflow in Chromium
        run: ./scripts/test-browser-e2e.sh "${{ steps.package.outputs.artifact }}"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collection-tag-sync-package
          if-no-files-found: error
          retention-days: 30
          path: ${{ steps.package.outputs.artifact }}
